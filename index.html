<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧考勤雲端版</title>
    <!-- 載入 React 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Lucide 圖標 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 載入 Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Firebase 初始化 (環境變數由系統提供)
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'v3-attendance-cloud';

        // --- 常數設定 ---
        const EMPLOYEES = ["A001", "A002", "A003", "A004", "A005"];
        const LEAVE_TYPES = ["特休", "年假", "病假", "事假", "例假", "喪假", "產假", "陪產", "婚假", "公假"];

        // 圖標組件
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isLogin, setIsLogin] = useState(false);
            const [empId, setEmpId] = useState("");
            const [password, setPassword] = useState("");
            const [currentTime, setCurrentTime] = useState(new Date());
            const [attendanceData, setAttendanceData] = useState({});
            const [showLeaveModal, setShowLeaveModal] = useState(false);
            const [leaveForm, setLeaveForm] = useState({ date: new Date().toISOString().split('T')[0], type: "特休" });
            const [toast, setToast] = useState(null);

            const curMonthKey = `${currentTime.getFullYear()}-${String(currentTime.getMonth() + 1).padStart(2, '0')}`;
            const curDay = currentTime.getDate();

            // 認證與監聽
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (u) => {
                    if (!u) {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    }
                    setUser(u);
                });

                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => { unsubscribe(); clearInterval(timer); };
            }, []);

            // 數據監聽
            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('artifacts').doc(appId).collection('public').doc('data')
                    .collection('attendance').onSnapshot(snap => {
                        const data = {};
                        snap.forEach(doc => data[doc.id] = doc.data());
                        setAttendanceData(data);
                    });
                return () => unsub();
            }, [user]);

            const showToast = (text, type = 'success') => {
                setToast({ text, type });
                setTimeout(() => setToast(null), 3000);
            };

            const handleLogin = () => {
                if (EMPLOYEES.includes(empId.toUpperCase()) && password === '8888') {
                    setEmpId(empId.toUpperCase());
                    setIsLogin(true);
                    showToast(`歡迎回來 ${empId.toUpperCase()}`);
                } else {
                    showToast("員編或密碼錯誤", "error");
                }
            };

            const handlePunch = async (type) => {
                const timeStr = currentTime.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                const currentDoc = attendanceData[empId] || {};
                const monthData = currentDoc[curMonthKey] || {};
                
                let status = "正常";
                if (type === 'on' && timeStr > "09:00") status = "遲到";

                monthData[curDay] = { 
                    ...monthData[curDay], 
                    [type]: timeStr, 
                    status: type === 'on' ? status : (monthData[curDay]?.status || "正常")
                };
                currentDoc[curMonthKey] = monthData;

                await db.collection('artifacts').doc(appId).collection('public').doc('data')
                    .collection('attendance').doc(empId).set(currentDoc);
                
                showToast(`已紀錄 ${type === 'on' ? '上班' : '下班'}: ${timeStr}`);
            };

            const submitLeave = async () => {
                const lDate = new Date(leaveForm.date);
                const mKey = `${lDate.getFullYear()}-${String(lDate.getMonth() + 1).padStart(2, '0')}`;
                const dKey = lDate.getDate();

                const currentAtt = { ...(attendanceData[empId] || {}) };
                const mData = { ...(currentAtt[mKey] || {}) };
                mData[dKey] = { status: leaveForm.type, type: 'leave' };
                currentAtt[mKey] = mData;

                await db.collection('artifacts').doc(appId).collection('public').doc('data')
                    .collection('attendance').doc(empId).set(currentAtt);
                
                showToast(`已申請 ${leaveForm.type}`);
                setShowLeaveModal(false);
            };

            if (!isLogin) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
                            <div className="p-8 bg-indigo-600 text-white text-center">
                                <Icon name="clock" size={48} className="mx-auto mb-4" />
                                <h1 className="text-2xl font-bold">AI 智慧考勤系統</h1>
                                <p className="opacity-80">請輸入員工編號登入</p>
                            </div>
                            <div className="p-8 space-y-4">
                                <input className="w-full p-4 bg-slate-100 rounded-xl outline-none" placeholder="員編 (A001-A005)" value={empId} onChange={e => setEmpId(e.target.value)} />
                                <input className="w-full p-4 bg-slate-100 rounded-xl outline-none" type="password" placeholder="密碼 (8888)" value={password} onChange={e => setPassword(e.target.value)} />
                                <button onClick={handleLogin} className="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg">進入系統</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8">
                    {toast && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full text-white shadow-xl flex items-center gap-2 ${toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
                            <Icon name={toast.type === 'error' ? "alert-circle" : "check-circle"} />
                            {toast.text}
                        </div>
                    )}

                    <header className="flex justify-between items-end mb-8">
                        <div>
                            <h1 className="text-3xl font-black text-slate-800">智慧考勤系統</h1>
                            <p className="text-indigo-600 font-mono font-bold mt-1 text-lg">{currentTime.toLocaleString()}</p>
                        </div>
                        <div className="text-right">
                            <p className="font-bold text-slate-700">員工: {empId}</p>
                            <button onClick={() => setIsLogin(false)} className="text-sm text-slate-400 hover:text-red-500">登出系統</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* 打卡區 */}
                        <div className="md:col-span-1 space-y-6">
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                <h2 className="font-bold mb-4 flex items-center gap-2 text-slate-600"><Icon name="zap" /> 快速打卡</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => handlePunch('on')} className="p-6 bg-emerald-50 text-emerald-700 rounded-2xl hover:bg-emerald-100 font-bold transition-all">上班</button>
                                    <button onClick={() => handlePunch('off')} className="p-6 bg-slate-50 text-slate-700 rounded-2xl hover:bg-slate-100 font-bold transition-all">下班</button>
                                </div>
                                <button onClick={() => setShowLeaveModal(true)} className="w-full mt-4 py-4 bg-slate-800 text-white font-bold rounded-2xl">申請請假 / 出差</button>
                            </div>
                        </div>

                        {/* 報表區 */}
                        <div className="md:col-span-2">
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-6 border-b border-slate-100 bg-slate-50/50">
                                    <h2 className="font-bold flex items-center gap-2 text-slate-600"><Icon name="file-text" /> 本月出勤細目 ({curMonthKey})</h2>
                                </div>
                                <table className="w-full text-left">
                                    <thead>
                                        <tr className="text-xs font-bold text-slate-400 uppercase">
                                            <th className="p-4">日期</th>
                                            <th className="p-4">上班</th>
                                            <th className="p-4">下班</th>
                                            <th className="p-4">狀態</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {Object.keys(attendanceData[empId]?.[curMonthKey] || {}).sort((a,b) => b-a).map(day => {
                                            const rec = attendanceData[empId][curMonthKey][day];
                                            return (
                                                <tr key={day} className="hover:bg-slate-50">
                                                    <td className="p-4 font-bold text-slate-700">{day}日</td>
                                                    <td className="p-4 text-slate-500 font-mono">{rec.on || '--'}</td>
                                                    <td className="p-4 text-slate-500 font-mono">{rec.off || '--'}</td>
                                                    <td className="p-4">
                                                        <span className={`px-2 py-1 rounded-full text-xs font-bold ${rec.status === '正常' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                            {rec.status}
                                                        </span>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* 請假彈窗 */}
                    {showLeaveModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
                                <div className="p-6 bg-slate-800 text-white flex justify-between items-center">
                                    <h3 className="font-bold flex items-center gap-2"><Icon name="coffee" /> 請假單申請</h3>
                                    <button onClick={() => setShowLeaveModal(false)}><Icon name="x" /></button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-400">假別</label>
                                        <select className="w-full p-3 bg-slate-100 rounded-xl" value={leaveForm.type} onChange={e => setLeaveForm({...leaveForm, type: e.target.value})}>
                                            {LEAVE_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-400">日期</label>
                                        <input type="date" className="w-full p-3 bg-slate-100 rounded-xl" value={leaveForm.date} onChange={e => setLeaveForm({...leaveForm, date: e.target.value})} />
                                    </div>
                                    <button onClick={submitLeave} className="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl">提交申請</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
