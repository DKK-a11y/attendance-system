<script>
const userCredentials = { "A001": "8888", "A002": "8888", "A003": "8888", "A004": "8888", "A005": "8888" };
const employees = ["A001", "A002", "A003", "A004", "A005"];

const now = new Date();
const curY = now.getFullYear();
const curM = now.getMonth();
const curD = now.getDate();

let attendanceData = {};

// ✅ 從後端抓資料
async function loadData() {
    try {
        const res = await fetch("/api/getData");
        const data = await res.json();
        attendanceData = data || {};
    } catch (e) {
        console.log("尚未有資料，使用空資料");
        attendanceData = {};
    }
}

// ✅ 登入
async function login() {
    const id = document.getElementById('loginId').value.toUpperCase();
    const pw = document.getElementById('loginPw').value;

    if (userCredentials[id] && userCredentials[id] === pw) {

        await loadData(); // 🔥 改這裡

        initMonthSelect();
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainDashboard').classList.remove('hidden');
        document.getElementById('userDisp').innerText = id;
        document.getElementById('leaveDate').valueAsDate = new Date();

        initTable();
        updateDailyRate();
    } else {
        document.getElementById('loginError').classList.remove('hidden');
    }
}

// ✅ 打卡（送到 API）
async function doPunch(type) {
    const id = document.getElementById('userDisp').innerText;

    await fetch("/api/checkin", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: id,
            type: type
        })
    });

    alert("打卡成功");

    await loadData();
    initTable();
    updateDailyRate();
}

// ✅ 請假
async function applyLeave() {
    const id = document.getElementById('userDisp').innerText;
    const dateVal = document.getElementById('leaveDate').value;
    const type = document.getElementById('leaveTypeSelect').value;

    if (!dateVal) return alert("請選擇日期");

    await fetch("/api/leave", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: id,
            date: dateVal,
            type: type
        })
    });

    alert("請假成功");

    await loadData();
    initTable();
}

// ✅ 月份選單
function initMonthSelect() {
    const select = document.getElementById('monthSelect');
    let html = "";
    for (let i = 2; i >= 0; i--) {
        let d = new Date(curY, curM - i, 1);
        let m = d.getMonth();
        let y = d.getFullYear();
        html += `<option value="${y}-${m}">${y}年 ${m + 1}月</option>`;
    }
    select.innerHTML = html;
}

// ✅ 表格
function initTable() {
    const val = document.getElementById('monthSelect').value;
    if(!val) return;

    const [y, m] = val.split('-').map(Number);
    const key = `${y}-${m}`;
    const daysInM = new Date(y, m + 1, 0).getDate();

    let h = `<tr><th>工號</th>`;
    for (let d = 1; d <= daysInM; d++) {
        h += `<th>${d}</th>`;
    }
    document.getElementById('tableHead').innerHTML = h + `</tr>`;

    let b = "";

    employees.forEach(emp => {
        b += `<tr><td>${emp}</td>`;
        for (let d = 1; d <= daysInM; d++) {
            let content = "—";

            if (attendanceData[emp] &&
                attendanceData[emp][key] &&
                attendanceData[emp][key][d]) {

                content = attendanceData[emp][key][d].s;
            }

            b += `<td>${content}</td>`;
        }
        b += `</tr>`;
    });

    document.getElementById('tableBody').innerHTML = b;
}

// ✅ 今日出席率
function updateDailyRate() {
    const key = `${curY}-${curM}`;
    let p = 0;

    employees.forEach(e => {
        if (attendanceData[e] &&
            attendanceData[e][key] &&
            attendanceData[e][key][curD]) {
            p++;
        }
    });

    document.getElementById('dailyRate').innerText =
        `${(p / employees.length * 100).toFixed(1)}%`;
}
</script>
