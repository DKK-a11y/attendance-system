<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧考勤雲端版</title>
    <!-- 載入 React 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Lucide 圖標 -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 模擬 Lucide 圖標組件
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // --- 常數設定 ---
        const EMPLOYEES = ["A001", "A002", "A003", "A004", "A005"];
        const LEAVE_TYPES = ["特休", "年假", "病假", "事假", "例假", "喪假", "產假", "陪產", "婚假", "公假"];

        function App() {
            const [isLogin, setIsLogin] = useState(false);
            const [empId, setEmpId] = useState("");
            const [password, setPassword] = useState("");
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const handleLogin = () => {
                if (EMPLOYEES.includes(empId.toUpperCase()) && password === '8888') {
                    setEmpId(empId.toUpperCase());
                    setIsLogin(true);
                } else {
                    alert("員編或密碼錯誤 (預設密碼 8888)");
                }
            };

            if (!isLogin) {
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
                            <div className="p-8 bg-indigo-600 text-white text-center">
                                <h1 className="text-2xl font-bold">AI 智慧考勤系統</h1>
                                <p className="opacity-80">請登入以繼續</p>
                            </div>
                            <div className="p-8 space-y-4">
                                <input 
                                    className="w-full p-4 bg-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                                    placeholder="員工編號 (如: A001)"
                                    value={empId}
                                    onChange={(e) => setEmpId(e.target.value)}
                                />
                                <input 
                                    type="password"
                                    className="w-full p-4 bg-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                                    placeholder="密碼"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                />
                                <button 
                                    onClick={handleLogin}
                                    className="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-all"
                                >
                                    進入系統
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                    <header className="max-w-6xl mx-auto flex justify-between items-center mb-8">
                        <div>
                            <h1 className="text-2xl font-black text-slate-800">智慧考勤</h1>
                            <p className="text-indigo-600 font-bold">{currentTime.toLocaleString()}</p>
                        </div>
                        <div className="flex items-center gap-4">
                            <span className="font-bold text-slate-700">員工: {empId}</span>
                            <button onClick={() => setIsLogin(false)} className="text-slate-400 hover:text-red-500">登出</button>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 text-center">
                            <h2 className="text-xl font-bold mb-6">今日打卡</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <button className="py-8 bg-emerald-50 text-emerald-700 rounded-2xl border-2 border-transparent hover:border-emerald-500 font-bold">
                                    上班打卡
                                </button>
                                <button className="py-8 bg-slate-50 text-slate-700 rounded-2xl border-2 border-transparent hover:border-slate-800 font-bold">
                                    下班打卡
                                </button>
                            </div>
                        </div>

                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                            <h2 className="text-xl font-bold mb-4">功能選單</h2>
                            <div className="space-y-4">
                                <button className="w-full p-4 bg-indigo-50 text-indigo-700 rounded-xl font-bold text-left flex justify-between items-center">
                                    申請請假 / 出差 <span>→</span>
                                </button>
                                <button className="w-full p-4 bg-slate-50 text-slate-700 rounded-xl font-bold text-left flex justify-between items-center">
                                    查看出勤報表 <span>→</span>
                                </button>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
