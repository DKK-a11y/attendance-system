<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 智能雲端考勤系統 - 旗艦完整版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tooltip { position: relative; cursor: help; }
        .tooltip:hover::after {
            content: attr(data-tip);
            position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: #fff; padding: 8px 12px; border-radius: 8px;
            font-size: 11px; white-space: pre-wrap; z-index: 100; width: 180px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); line-height: 1.6;
        }
        .table-container { overflow-x: auto; scrollbar-width: thin; max-height: 400px; }
        .sticky-col { position: sticky; left: 0; background: white; z-index: 10; border-right: 2px solid #e2e8f0 !important; }
        .progress-bar { height: 6px; border-radius: 3px; background: #e2e8f0; overflow: hidden; margin-top: 4px; }
        .progress-fill { height: 100%; transition: width 0.5s ease-out; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div id="loginPage" class="flex items-center justify-center min-h-screen bg-slate-900 p-6">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md border-t-8 border-blue-600">
            <h2 class="text-3xl font-black text-center mb-2 uppercase tracking-widest text-slate-800">Staff Secure</h2>
            <p class="text-center text-slate-400 text-xs mb-8 font-bold">工號 A001-A005 / 密碼 8888</p>
            <div class="space-y-4">
                <input type="text" id="loginId" placeholder="工號" class="w-full p-4 bg-slate-100 border-none rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                <input type="password" id="loginPw" placeholder="密碼" class="w-full p-4 bg-slate-100 border-none rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition-all active:scale-95 shadow-xl mt-4">進入系統</button>
            </div>
            <p id="loginError" class="text-rose-500 text-xs text-center mt-4 font-bold hidden">身分驗證失敗，請檢查工號或密碼</p>
        </div>
    </div>

    <div id="mainDashboard" class="hidden">
        <header class="bg-white border-b sticky top-0 z-50 px-8 py-6 shadow-sm">
            <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 items-center gap-6">
                <div class="flex gap-3 justify-center lg:justify-start">
                    <div class="text-center bg-slate-50 px-3 py-2 rounded-xl border">
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">當日出席</p>
                        <p id="dailyRate" class="text-base font-black text-green-500">0.0%</p>
                    </div>
                    <div class="text-center bg-slate-50 px-3 py-2 rounded-xl border">
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">當月出席</p>
                        <p id="monthlyRate" class="text-base font-black text-blue-600">--</p>
                    </div>
                    <div class="text-center bg-slate-50 px-3 py-2 rounded-xl border">
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">年度累計</p>
                        <p class="text-base font-black text-slate-700">98.5%</p>
                    </div>
                </div>
                <div class="text-center">
                    <div id="clock" class="text-5xl font-mono font-black text-slate-800 tracking-tighter">00:00:00</div>
                    <div id="dateStr" class="text-xs text-blue-600 font-bold mt-2 tracking-widest uppercase"></div>
                </div>
                <div class="flex justify-center lg:justify-end">
                    <select id="monthSelect" onchange="initTable()" class="p-2 bg-slate-100 border-none rounded-xl font-bold text-sm">
                        <option value="0">2026年 1月</option>
                        <option value="1">2026年 2月</option>
                        <option value="2" selected>2026年 3月</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="max-w-[98%] mx-auto p-6 space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 text-center">
                        <p class="text-[10px] text-slate-400 mb-2 font-bold uppercase tracking-widest">Welcome</p>
                        <p id="userDisp" class="text-3xl font-black text-blue-600 mb-6">--</p>
                        <button onclick="doPunch('上班')" class="w-full mb-3 bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition">☀️ 簽到上班</button>
                        <button onclick="doPunch('下班')" class="w-full bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold active:scale-95 transition">🌙 簽退下班</button>
                        <p id="punchTypeResult" class="mt-4 text-[10px] font-black text-blue-500 bg-blue-50 py-2 rounded-xl h-8 flex items-center justify-center"></p>
                    </div>

                    <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                        <h3 class="font-bold text-xs uppercase text-slate-400 mb-5 tracking-widest">可休假別與天數</h3>
                        <div id="leaveBalanceList" class="space-y-6"></div>
                    </div>
                </div>

                <div class="lg:col-span-4 bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b bg-slate-50/50 flex flex-wrap justify-between items-center gap-4">
                        <div class="flex gap-2">
                            <input type="text" id="searchId" placeholder="工號 A001-A005" class="text-xs p-3 border rounded-xl outline-none w-48 focus:ring-2 focus:ring-blue-500">
                            <button onclick="searchEmp()" class="text-xs bg-slate-800 text-white px-6 rounded-xl font-bold hover:bg-black transition">分析統計報表</button>
                        </div>
                        <div class="flex gap-4 text-[9px] font-bold uppercase bg-white px-3 py-1 rounded-full border">
                            <span class="text-slate-900">● 正常</span> <span class="text-red-500">● 遲到</span> <span class="text-green-500">● 早退</span> <span class="text-indigo-500">● 休假</span>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="w-full text-xs text-center border-collapse">
                            <thead id="tableHead" class="bg-slate-50 text-slate-400 font-bold"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="searchResultPanel" class="hidden space-y-6">
                <div class="bg-white p-8 rounded-[3rem] shadow-xl border-l-8 border-slate-800">
                    <div class="flex justify-between items-start mb-8">
                        <h2 id="resultTitle" class="text-3xl font-black text-slate-800">員工出席大數據報表</h2>
                        <button onclick="document.getElementById('searchResultPanel').classList.add('hidden')" class="text-slate-300 text-2xl">✕</button>
                    </div>
                    <div id="annualSummary" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-10"></div>
                    <div class="overflow-x-auto rounded-2xl border">
                        <table class="w-full text-sm">
                            <thead class="bg-slate-800 text-white">
                                <tr><th class="p-4 text-left">月份分析</th><th class="p-4 text-center">正常天數</th><th class="p-4 text-center">遲到次數</th><th class="p-4 text-center">早退次數</th><th class="p-4 text-center">請假天數</th><th class="p-4 text-center">出席率</th></tr>
                            </thead>
                            <tbody id="monthlyDetailBody" class="bg-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const userCredentials = { "A001": "8888", "A002": "8888", "A003": "8888", "A004": "8888", "A005": "8888" };
        const employees = ["A001", "A002", "A003", "A004", "A005"];
        const curY = 2026, curM = 2, curD = 12; // 模擬今日為 3/12
        let attendanceData = {};

        const leaveConfig = {
            "A001": { "特休": {total: 10, used: 2}, "病假": {total: 30, used: 1}, "事假": {total: 7, used: 0} },
            "A002": { "特休": {total: 7, used: 5}, "病假": {total: 30, used: 4}, "事假": {total: 7, used: 2} },
            "A003": { "特休": {total: 14, used: 0}, "病假": {total: 30, used: 0}, "事假": {total: 7, used: 1} },
            "A004": { "特休": {total: 7, used: 1}, "病假": {total: 30, used: 10}, "事假": {total: 7, used: 0} },
            "A005": { "特休": {total: 3, used: 0}, "病假": {total: 30, used: 2}, "事假": {total: 7, used: 5} }
        };

        function generateData() {
            employees.forEach(emp => {
                attendanceData[emp] = { 0: {}, 1: {}, 2: {} };
                for (let m = 0; m <= 2; m++) {
                    let days = new Date(curY, m + 1, 0).getDate();
                    for (let d = 1; d <= days; d++) {
                        if (m === 2 && d >= curD) continue;
                        const w = new Date(curY, m, d).getDay();
                        if (w === 0 || w === 6) continue;
                        let r = Math.random();
                        if (r < 0.82) attendanceData[emp][m][d] = { s: "正常", on: "08:52", off: "18:05" };
                        else if (r < 0.88) attendanceData[emp][m][d] = { s: "遲到", on: "09:15", off: "18:10" };
                        else if (r < 0.94) attendanceData[emp][m][d] = { s: "早退", on: "08:50", off: "16:40" };
                        else attendanceData[emp][m][d] = { s: "特休", on: "請假", off: "請假" };
                    }
                }
            });
        }

        function login() {
            const id = document.getElementById('loginId').value.toUpperCase();
            const pw = document.getElementById('loginPw').value;
            if (userCredentials[id] && userCredentials[id] === pw) {
                generateData();
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                document.getElementById('userDisp').innerText = id;
                renderLeaveBalance(id); initTable(); updateDailyRate();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function renderLeaveBalance(uid) {
            const data = leaveConfig[uid] || leaveConfig["A001"];
            let html = "";
            for (let type in data) {
                const leave = data[type]; const remain = leave.total - leave.used; const percent = (remain / leave.total) * 100;
                html += `<div><div class="flex justify-between text-xs font-bold mb-1"><span>${type}</span><span class="text-slate-400">剩餘 ${remain}D / ${leave.total}D</span></div>
                         <div class="progress-bar"><div class="progress-fill bg-blue-600" style="width: ${percent}%"></div></div></div>`;
            }
            document.getElementById('leaveBalanceList').innerHTML = html;
        }

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB');
            document.getElementById('dateStr').innerText = new Date().toDateString().toUpperCase();
        }
        setInterval(updateClock, 1000); updateClock();

        function initTable() {
            const m = parseInt(document.getElementById('monthSelect').value);
            const daysInM = new Date(curY, m + 1, 0).getDate();
            const wNames = ['日', '一', '二', '三', '四', '五', '六'];
            let h = `<tr><th class="p-4 sticky-col border-b">工號</th>`;
            for (let d = 1; d <= daysInM; d++) h += `<th class="p-2 border-b ${(m===curM&&d===curD)?'bg-blue-600 text-white':''}">${d}<br>${wNames[new Date(curY, m, d).getDay()]}</th>`;
            document.getElementById('tableHead').innerHTML = h + `</tr>`;
            let b = "";
            employees.forEach(emp => {
                b += `<tr><td class="p-4 font-black sticky-col border-b shadow-sm bg-white">${emp}</td>`;
                for (let d = 1; d <= daysInM; d++) {
                    const w = new Date(curY, m, d).getDay();
                    let content = "—", color = "text-slate-200", tip = "無記錄";
                    if (w === 0 || w === 6) { content = "例假"; color = "text-slate-300"; }
                    else if (attendanceData[emp][m][d]) {
                        const data = attendanceData[emp][m][d];
                        content = data.s; 
                        tip = `上班：${data.on || '--'}\n下班：${data.off || '--'}`;
                        if (content === "遲到") color = "text-red-500";
                        else if (content === "早退") color = "text-green-500";
                        else if (content === "遲到/早退") color = "text-red-600 font-black";
                        else if (content === "正常") color = "text-slate-900";
                        else color = "text-indigo-500";
                    }
                    b += `<td class="p-2 border-b border-r border-slate-50 font-bold ${color} tooltip" data-tip="${tip}">${content}</td>`;
                }
                b += `</tr>`;
            });
            document.getElementById('tableBody').innerHTML = b;
            updateMonthlyRate();
        }

        // 修改後的 doPunch：處理雙重異常
        function doPunch(type) {
            const t = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
            const h = new Date().getHours();
            const id = document.getElementById('userDisp').innerText;
            if (!attendanceData[id][curM][curD]) attendanceData[id][curM][curD] = { s: "正常", on: "", off: "" };
            let rec = attendanceData[id][curM][curD];

            if (type === '上班') {
                rec.on = t;
                if (h >= 9) rec.s = "遲到";
            } else {
                rec.off = t;
                if (h < 18) {
                    if (rec.s === "遲到") rec.s = "遲到/早退";
                    else rec.s = "早退";
                }
            }
            initTable(); updateDailyRate();
            document.getElementById('punchTypeResult').innerText = `已紀錄 ${type}：${t} (${rec.s})`;
        }

        function updateDailyRate() {
            let p = 0; employees.forEach(e => { if (attendanceData[e][curM][curD]) p++; });
            document.getElementById('dailyRate').innerText = `${(p/employees.length*100).toFixed(1)}%`;
        }

        function updateMonthlyRate() {
            const m = parseInt(document.getElementById('monthSelect').value);
            let total = 0, present = 0;
            employees.forEach(e => {
                Object.values(attendanceData[e][m]).forEach(v => { total++; if (["正常", "遲到", "早退", "遲到/早退"].includes(v.s)) present++; });
            });
            document.getElementById('monthlyRate').innerText = total > 0 ? `${(present/total*100).toFixed(1)}%` : "0.0%";
        }

        function searchEmp() {
            const id = document.getElementById('searchId').value.toUpperCase();
            if (!employees.includes(id)) return alert("找不到該工號");
            let annual = { n: 0, l: 0, e: 0, lv: 0 };
            let monthly = [{ name: "1月", n: 0, l: 0, e: 0, lv: 0, total: 0 }, { name: "2月", n: 0, l: 0, e: 0, lv: 0, total: 0 }, { name: "3月", n: 0, l: 0, e: 0, lv: 0, total: 0 }];
            
            [0, 1, 2].forEach(m => {
                Object.values(attendanceData[id][m]).forEach(r => {
                    monthly[m].total++;
                    if (r.s === "正常") { monthly[m].n++; annual.n++; }
                    else if (r.s === "遲到") { monthly[m].l++; annual.l++; }
                    else if (r.s === "早退") { monthly[m].e++; annual.e++; }
                    else if (r.s === "遲到/早退") { 
                        monthly[m].l++; annual.l++; 
                        monthly[m].e++; annual.e++; 
                    }
                    else { monthly[m].lv++; annual.lv++; }
                });
            });

            const totalDays = annual.n + annual.l + annual.e + annual.lv;
            const annRate = (((annual.n + annual.l + annual.e)/totalDays)*100).toFixed(1);
            
            document.getElementById('annualSummary').innerHTML = `
                <div class="bg-blue-600 text-white p-5 rounded-3xl"><p class="text-[10px] font-bold opacity-70">年度出席率</p><p class="text-3xl font-black">${annRate}%</p></div>
                <div class="bg-slate-100 p-5 rounded-3xl"><p class="text-[10px] font-bold text-slate-400">正常</p><p class="text-3xl font-black">${annual.n}</p></div>
                <div class="bg-red-50 p-5 rounded-3xl text-red-600"><p class="text-[10px] font-bold">遲到</p><p class="text-3xl font-black">${annual.l}</p></div>
                <div class="bg-green-50 p-5 rounded-3xl text-green-600"><p class="text-[10px] font-bold">早退</p><p class="text-3xl font-black">${annual.e}</p></div>
                <div class="bg-indigo-50 p-5 rounded-3xl text-indigo-600"><p class="text-[10px] font-bold">請假</p><p class="text-3xl font-black">${annual.lv}</p></div>`;
            
            let tableH = "";
            monthly.forEach(m => {
                const mRate = m.total > 0 ? (((m.total-m.lv)/m.total)*100).toFixed(1) : "0.0";
                tableH += `<tr class="border-b"><td class="p-4 font-bold text-left">${m.name}</td>
                    <td class="text-center">${m.n}</td><td class="text-red-500 font-bold text-center">${m.l}</td>
                    <td class="text-green-600 font-bold text-center">${m.e}</td><td class="text-center">${m.lv}</td>
                    <td class="text-center"><span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-black text-xs">${mRate}%</span></td></tr>`;
            });
            document.getElementById('monthlyDetailBody').innerHTML = tableH;
            document.getElementById('searchResultPanel').classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
