<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧考勤系統 - 管理登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f3f4f6; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- 登入頁面 -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full fade-in">
            <div class="text-center mb-8">
                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">管理員登入</h1>
                <p class="text-gray-500 mt-2">請輸入您的憑證以管理考勤系統</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">帳號</label>
                    <input type="text" id="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="請輸入帳號">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" placeholder="請輸入密碼">
                </div>
                <div id="errorMessage" class="hidden text-red-500 text-sm text-center">帳號或密碼錯誤，請重試。</div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">
                    登入系統
                </button>
            </form>
        </div>
    </div>

    <!-- 後台管理頁面 (初始隱藏) -->
    <div id="adminDashboard" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center fade-in">
            <div class="flex justify-end mb-4">
                <button onclick="logout()" class="text-sm text-gray-400 hover:text-red-500 transition">登出</button>
            </div>
            <div class="mb-6">
                <div class="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">考勤系統後台</h1>
                <p class="text-gray-500 mt-2">系統已在雲端運行，並與 Telegram 連動</p>
            </div>
            
            <div class="space-y-4 text-left">
                <div class="p-4 bg-gray-50 rounded-lg border border-gray-100">
                    <p class="text-sm font-semibold text-gray-700 flex items-center">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                        伺服器狀態：<span class="text-green-600 ml-1">運作中</span>
                    </p>
                </div>
                <div class="p-4 bg-gray-50 rounded-lg border border-gray-100">
                    <p class="text-sm font-semibold text-gray-700">Telegram Bot:</p>
                    <p class="text-sm text-gray-500 mt-1">@Attendance_Bot</p>
                </div>
            </div>
            
            <div class="mt-8">
                <button class="w-full bg-gray-800 hover:bg-black text-white font-medium py-2 rounded-lg transition duration-200">
                    進入詳細報表
                </button>
            </div>
        </div>
    </div>

    <script>
        // 簡單的登入邏輯（範例使用 admin / 1234）
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            // 這裡可以換成您的實際驗證邏輯
            if (user === 'admin' && pass === '1234') {
                errorMsg.classList.add('hidden');
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                
                // 儲存登入狀態
                localStorage.setItem('isLoggedIn', 'true');
            } else {
                errorMsg.classList.remove('hidden');
            }
        });

        // 登出功能
        function logout() {
            localStorage.removeItem('isLoggedIn');
            location.reload();
        }

        // 檢查是否已經登入
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
